name: CI

on:
  push:
    branches: [main, 'ticket/**']
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack
          POSTGRES_DB: fintrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fintrack:fintrack@localhost:5432/fintrack_test
      TEST_DATABASE_URL: postgresql://fintrack:fintrack@localhost:5432/fintrack_test
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters
      SEED_USER_EMAIL: seed@example.com
      SEED_USER_PASSWORD: seedpassword1
      SEED_USER_NAME: Seed Owner
      APP_URL: http://localhost:3000
      RESEND_API_KEY: re_test
      EMAIL_FROM: test@example.com
      SIGNUP_MODE: open

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run migrations
        run: pnpm db:migrate:deploy

      - name: Run seed
        run: pnpm db:seed

      - name: Run tests (with tax-engine coverage gate)
        run: pnpm test --coverage

      - name: Check test matrix coverage (P1 cases)
        run: pnpm test:matrix
